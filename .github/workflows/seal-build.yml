name: seal-build

on:
  workflow_dispatch:

jobs:
  build:
    name: build module zip and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build the module-zip helper
        run: |
          set -euxo pipefail
          HELPER="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/main.go"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .
          echo "helper built at $RUNNER_TEMP/create_mod"

      - name: Package golang.org/x/net v0.45.0 module zip
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # Upstream x/net ships no .github directory, and zip.CreateFromDir
          # descends into it, so remove it before packaging.
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" golang.org/x/net v0.45.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.45.0.zip"
          ls -l "$RUNNER_TEMP/out"

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

      - name: Build all packages
        run: go build ./...

      - name: Run the test suite
        run: go test ./...
